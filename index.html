<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sudoku Cage Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg1: #f1f4f6; --bg2: #dce5eb; --panel: #ffffff; --ink: #16323a; --muted: #5d7580; --hair: #d5dee4;
  --cell: #fbfcfd; --line: #16323a; --brass: #b8893b; --brass2: #e0bd76; --sel: #f6e7c1;
  --veil: rgba(255, 255, 255, .6); --card-shadow: 0 30px 60px -28px rgba(22, 50, 58, .45), 0 2px 6px rgba(22, 50, 58, .08);
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  --cellsize: min(56px, 9.6vw);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #0c171c; --bg2: #14262d; --panel: #16292f; --ink: #e8eff1; --muted: #93aab3; --hair: #2b444d;
    --veil: rgba(12, 23, 28, .6); --card-shadow: 0 30px 60px -28px rgba(0, 0, 0, .8), 0 2px 6px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --bg1: #0c171c; --bg2: #14262d; --panel: #16292f; --ink: #e8eff1; --muted: #93aab3; --hair: #2b444d;
  --veil: rgba(12, 23, 28, .6); --card-shadow: 0 30px 60px -28px rgba(0, 0, 0, .8), 0 2px 6px rgba(0, 0, 0, .4);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; color: var(--ink);
  font-family: var(--sans); background: radial-gradient(900px 500px at 50% -10%, rgba(224, 189, 118, .28), transparent 70%), linear-gradient(160deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
}
.app { width: min(100%, 1020px); padding: 34px 32px 36px; background: var(--panel); border: 1px solid var(--hair); border-radius: 28px; box-shadow: var(--card-shadow); }
.head { text-align: center; margin-bottom: 30px; }
h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: .01em; line-height: 1.05; }
.rule { width: 56px; height: 2px; margin: 14px auto 12px; background: linear-gradient(90deg, var(--brass), var(--brass2)); border-radius: 2px; }
.sub { margin: 0; color: var(--muted); font-size: .98rem; letter-spacing: .02em; }
.mode-switch { display: flex; justify-content: center; gap: 4px; width: fit-content; margin: 0 auto 24px; padding: 4px; border: 1px solid var(--hair); border-radius: 12px; background: var(--bg1); }
.mode-option { height: 38px; padding: 0 16px; border-color: transparent; }
.mode-option.active { color: var(--ink); background: var(--panel); border-color: var(--hair); box-shadow: 0 2px 6px rgba(22, 50, 58, .12); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }
.board-wrap { display: flex; flex-direction: column; align-items: center; min-width: 0; max-width: 100%; overflow-x: auto; padding: 4px 4px 18px; }
.stage { position: relative; width: max-content; }
.board {
  display: grid; grid-template-columns: repeat(9, var(--cellsize)); grid-template-rows: repeat(9, var(--cellsize));
  width: max-content; border: 3px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--cell);
  box-shadow: 0 0 0 6px rgba(184, 137, 59, .16), 0 26px 40px -22px rgba(22, 50, 58, .6);
}
.cell {
  position: relative; width: var(--cellsize); height: var(--cellsize); border: 1px solid rgba(22, 50, 58, .16);
  background: var(--cell); display: grid; place-items: center; cursor: pointer; user-select: none; color: #16323a;
  font-family: var(--serif); font-weight: 700; font-size: clamp(1.3rem, 4.6vw, 1.95rem); font-variant-numeric: lining-nums; font-feature-settings: "lnum";
  transition: filter .15s ease, box-shadow .15s ease, transform .15s ease;
}
.cell:hover { filter: brightness(.95) saturate(1.1); }
.cell.selected { background: var(--sel) !important; box-shadow: inset 0 0 0 2.5px var(--brass), inset 0 0 14px rgba(184, 137, 59, .35); animation: selection-pulse .22s ease-out; }
@keyframes selection-pulse { 0% { transform: scale(.95); } 65% { transform: scale(1.03); } 100% { transform: scale(1); } }
.cell::after { content: ''; position: absolute; inset: 3px; pointer-events: none; border: 0 dashed rgba(22, 50, 58, .55); }
.cell.cb-t::after { border-top-width: 1.5px; }
.cell.cb-r::after { border-right-width: 1.5px; }
.cell.cb-b::after { border-bottom-width: 1.5px; }
.cell.cb-l::after { border-left-width: 1.5px; }
.cell .value { position: relative; z-index: 1; }
.cell .cage-label {
  position: absolute; top: 5px; left: 7px; z-index: 2; font-family: var(--sans); font-weight: 500; line-height: 1;
  font-size: clamp(9px, 2.3vw, 11.5px); color: rgba(22, 50, 58, .78);
}
.cell:nth-child(3n) { border-right: 2px solid var(--line); }
.cell:nth-child(9n) { border-right: 1px solid rgba(22, 50, 58, .16); }
.cell:nth-child(n + 19):nth-child(-n + 27),
.cell:nth-child(n + 46):nth-child(-n + 54),
.cell:nth-child(n + 73):nth-child(-n + 81) { border-bottom: 2px solid var(--line); }

.board.solving .cell { pointer-events: none; }
.cell .value.ghost { color: #9a6f22; font-weight: 600; opacity: .5; }
.cell .value.tick { animation: tick .45s ease-out both; }
@keyframes tick { 0% { opacity: 1; transform: scale(1.35); color: #b8893b; } 100% { opacity: .5; transform: scale(1); } }
.cell .value.pop { animation: rise .6s cubic-bezier(.2, .9, .3, 1.2) both; animation-delay: var(--d); }
@keyframes rise { 0% { opacity: 0; transform: translateY(10px) scale(.6); } 100% { opacity: 1; transform: none; } }
.cell.flash { animation: glow 1.1s ease-out both; animation-delay: var(--d); }
@keyframes glow { 0% { box-shadow: inset 0 0 0 40px rgba(224, 189, 118, .85); } 100% { box-shadow: inset 0 0 0 40px rgba(224, 189, 118, 0); } }

.thinking { position: absolute; inset: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; border-radius: 14px; pointer-events: none; overflow: hidden; background: linear-gradient(to top, var(--veil), transparent 50%); }
.thinking[hidden] { display: none; }
.thinking::before { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(224, 189, 118, .45) 50%, transparent 65%); transform: translateX(-100%); animation: sweep 1.8s ease-in-out infinite; }
@keyframes sweep { to { transform: translateX(100%); } }
.think-card { position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 20px 9px 14px; background: var(--panel); color: var(--ink); border: 1px solid var(--hair); border-radius: 18px; box-shadow: var(--card-shadow); }
.spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(184, 137, 59, .25); border-top-color: var(--brass); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.think-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; line-height: 1.1; }
.think-time { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

.confetti { position: absolute; top: -12px; z-index: 6; border-radius: 2px; pointer-events: none; animation: fall 2s ease-in forwards; }
@keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(calc(var(--cellsize) * 9 + 40px)) rotate(540deg); opacity: 0; } }

.panel { display: flex; flex-direction: column; gap: 12px; }
.panel label { display: flex; flex-direction: column; gap: 8px; font-size: .9rem; font-weight: 500; color: var(--muted); }
.panel input {
  height: 46px; padding: 0 16px; font: 500 1.1rem var(--sans); color: var(--ink); background: transparent;
  border: 1px solid var(--hair); border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.cage-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 10px; width: min(100%, 460px); margin-top: 18px; }
.cage-entry label { display: flex; flex-direction: column; gap: 8px; min-width: 0; color: var(--muted); font-size: .9rem; font-weight: 500; }
.cage-entry input {
  width: 100%; height: 46px; padding: 0 16px; font: 500 1.1rem var(--sans); color: var(--ink); background: transparent;
  border: 1px solid var(--hair); border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.panel input:focus { border-color: var(--brass); box-shadow: 0 0 0 4px rgba(184, 137, 59, .18); }
.cage-entry input:focus { border-color: var(--brass); box-shadow: 0 0 0 4px rgba(184, 137, 59, .18); }
.number-pad { display: flex; flex-direction: column; gap: 10px; }
.number-pad[hidden], .cage-entry[hidden], .cage-manager[hidden] { display: none; }
.number-hint { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.4; }
.digit-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.digit-key { height: 42px; padding: 0; font-family: var(--serif); font-size: 1.25rem; font-weight: 700; }
.number-clear { height: 40px; }
button {
  height: 46px; padding: 0 18px; font: 500 .98rem var(--sans); letter-spacing: .02em; cursor: pointer; color: #fff;
  background: var(--ink); border: 1px solid var(--ink); border-radius: 12px; transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}
:root:not([data-theme="light"]) button:not(.secondary):not(.solve) { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button:not(.secondary):not(.solve) { color: #0c171c; } }
:root[data-theme="dark"] button:not(.secondary):not(.solve) { color: #0c171c; }
button:hover { transform: translateY(-1px); box-shadow: 0 10px 18px -10px rgba(22, 50, 58, .55); }
button:active { transform: translateY(1px); box-shadow: none; }
button.secondary { color: var(--ink); background: transparent; border-color: var(--hair); }
button.secondary:hover { border-color: var(--brass); box-shadow: none; }
button.solve { color: #2a1d06; font-weight: 600; background: linear-gradient(135deg, var(--brass2), var(--brass)); border-color: transparent; box-shadow: 0 10px 20px -12px rgba(184, 137, 59, .9); }
button:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
button:focus-visible { outline: 3px solid rgba(184, 137, 59, .55); outline-offset: 2px; }
.list-title { margin-top: 10px; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; }
.cage-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow: auto; margin-top: 8px; }
.cage-list:empty::before { content: 'No cages yet. Select cells and enter a total.'; color: var(--muted); font-size: .9rem; }
.cage-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 9px 8px 13px; border: 1px solid rgba(22, 50, 58, .14); border-left: 4px solid var(--brass); border-radius: 10px; font-size: .88rem; line-height: 1.4; color: #16323a; transition: transform .15s ease, box-shadow .15s ease; }
.cage-item:hover { transform: translateX(2px); box-shadow: 0 4px 10px rgba(22, 50, 58, .08); }
.cage-description { min-width: 0; flex: 1; }
.cage-delete { flex: 0 0 auto; height: 34px; padding: 0 11px; color: #a1364d; background: transparent; border-color: rgba(161, 54, 77, .35); font-size: .82rem; }
.cage-delete:hover { border-color: #a1364d; box-shadow: none; }
.status {
  margin-top: 22px; min-height: 38px; padding: 8px 20px; width: fit-content; max-width: 100%; text-align: center;
  font-size: .95rem; font-weight: 500; color: var(--ink); border: 1px solid var(--hair); border-radius: 999px;
}
.status:empty { visibility: hidden; }
.status.error { color: #a1364d; border-color: #e6b8c2; background: rgba(217, 163, 168, .18); }
.status.success { color: #1f6b52; border-color: #a9d3c3; background: rgba(143, 184, 168, .2); }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; gap: 22px; } .app { padding: 26px 16px 28px; } }
@media (max-width: 420px) { .cage-entry { grid-template-columns: 1fr; } .cage-entry button { width: 100%; } }
@media (prefers-reduced-motion: reduce) {
  .cell.selected, .cell.flash, .cell .value.pop, .confetti, .thinking::before { animation: none !important; }
  .cage-item { transition: none !important; }
  
}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>Sudoku Cage Builder</h1>
    <div class="rule"></div>
    <p id="modeHint" class="sub">Select cells to form cages and enter their totals.</p>
  </div>

  <div class="mode-switch" role="group" aria-label="Sudoku mode">
    <button id="normalModeBtn" class="mode-option secondary" type="button" aria-pressed="false">Normal Sudoku</button>
    <button id="killerModeBtn" class="mode-option active" type="button" aria-pressed="true">Killer Sudoku</button>
  </div>

  <div class="layout">
    <div class="board-wrap">
      <div id="stage" class="stage">
        <div id="board" class="board" aria-label="Sudoku board"></div>
        <div id="thinking" class="thinking" hidden role="status" aria-live="polite">
          <div class="think-card">
            <div class="spinner"></div>
            <div>
              <div class="think-title">Solving puzzle</div>
              <div class="think-time"><span id="thinkTime">0.0</span> seconds</div>
            </div>
          </div>
        </div>
      </div>
      <div id="cageEntry" class="cage-entry">
        <label>
          Cage total
          <input id="cageTotal" type="number" min="1" max="81" value="15" placeholder="e.g. 15" />
        </label>
        <button id="saveCageBtn">Save cage</button>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <button id="solveBtn" class="solve">Solve</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <div id="numberPad" class="number-pad" hidden>
        <div class="list-title">Enter clues</div>
        <p class="number-hint">Select a cell, then choose a digit.</p>
        <div class="digit-grid" role="group" aria-label="Choose a digit">
          <button class="digit-key secondary" type="button" data-digit="1">1</button>
          <button class="digit-key secondary" type="button" data-digit="2">2</button>
          <button class="digit-key secondary" type="button" data-digit="3">3</button>
          <button class="digit-key secondary" type="button" data-digit="4">4</button>
          <button class="digit-key secondary" type="button" data-digit="5">5</button>
          <button class="digit-key secondary" type="button" data-digit="6">6</button>
          <button class="digit-key secondary" type="button" data-digit="7">7</button>
          <button class="digit-key secondary" type="button" data-digit="8">8</button>
          <button class="digit-key secondary" type="button" data-digit="9">9</button>
        </div>
        <button id="clearDigitBtn" class="number-clear secondary" type="button">Clear selected cell</button>
      </div>
      <div id="cageManager" class="cage-manager">
        <div class="list-title">Cage list</div>
        <div id="cageList" class="cage-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
const boardSize = 9;
const cageColors = ['#dcebe4', '#f1dfe0', '#dce6f2', '#f3e9d3', '#e6def0', '#d6ebeb', '#f3ddd1', '#e4ebd3', '#ecdfe8', '#dfe3ee'];
let selectedCells = [];
let cages = [];
let currentMode = 'killer';
const createEmptyBoard = () => Array.from({ length: 9 }, () => Array(9).fill(0));
let board = createEmptyBoard();
const modeStates = {
  killer: { board, selectedCells, cages },
  normal: { board: createEmptyBoard(), selectedCells: [], cages: [] }
};

const boardEl = document.getElementById('board');
const cageListEl = document.getElementById('cageList');
const statusEl = document.getElementById('status');
const cageTotalInput = document.getElementById('cageTotal');
const normalModeBtn = document.getElementById('normalModeBtn');
const killerModeBtn = document.getElementById('killerModeBtn');
const modeHintEl = document.getElementById('modeHint');
const cageEntryEl = document.getElementById('cageEntry');
const numberPadEl = document.getElementById('numberPad');
const cageManagerEl = document.getElementById('cageManager');
const thinkingEl = document.getElementById('thinking');
const timeEl = document.getElementById('thinkTime');
const stageEl = document.getElementById('stage');
let solving = false;
let timerId = null;

function setStatus(message, type = '') {
  statusEl.textContent = message;
  statusEl.classList.remove('error', 'success');
  if (type) statusEl.classList.add(type);
}

function switchMode(nextMode) {
  if (solving || currentMode === nextMode) return;

  modeStates[currentMode] = { board, selectedCells, cages };
  currentMode = nextMode;
  ({ board, selectedCells, cages } = modeStates[currentMode]);

  const isNormal = currentMode === 'normal';
  normalModeBtn.classList.toggle('active', isNormal);
  normalModeBtn.setAttribute('aria-pressed', String(isNormal));
  killerModeBtn.classList.toggle('active', !isNormal);
  killerModeBtn.setAttribute('aria-pressed', String(!isNormal));
  modeHintEl.textContent = isNormal
    ? 'Enter the given numbers, then solve using standard Sudoku rules.'
    : 'Select cells to form cages and enter their totals.';
  cageEntryEl.hidden = isNormal;
  numberPadEl.hidden = !isNormal;
  cageManagerEl.hidden = isNormal;
  renderBoard();
  renderCages();
  setStatus(isNormal ? 'Normal Sudoku mode.' : 'Killer Sudoku mode.');
}

function isSelectedCell(row, col) {
  return selectedCells.some(([r, c]) => r === row && c === col);
}

function getCageForCell(row, col) {
  return cages.find((cage) => cage.cells.some(([r, c]) => r === row && c === col));
}

function renderBoard(reveal = false) {
  boardEl.innerHTML = '';
  for (let row = 0; row < boardSize; row++) {
    for (let col = 0; col < boardSize; col++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.setProperty('--d', ((row + col) * 45) + 'ms');

      const cage = currentMode === 'killer' ? getCageForCell(row, col) : null;
      if (reveal) cell.classList.add('flash');
      if (cage) {
        const same = (r, c) => getCageForCell(r, c) === cage;
        if (!same(row - 1, col)) cell.classList.add('cb-t');
        if (!same(row, col + 1)) cell.classList.add('cb-r');
        if (!same(row + 1, col)) cell.classList.add('cb-b');
        if (!same(row, col - 1)) cell.classList.add('cb-l');
      }
      if (cage) cell.style.background = cageColors[cage.colorIndex % cageColors.length];
      if (isSelectedCell(row, col)) cell.classList.add('selected');

      if (board[row][col] !== 0) {
        const value = document.createElement('span');
        value.className = 'value' + (reveal ? ' pop' : '');
        value.textContent = board[row][col];
        cell.appendChild(value);
      }

      if (cage) {
        const label = document.createElement('span');
        label.className = 'cage-label';
        label.textContent = cage.total;
        cell.appendChild(label);
      }

      cell.dataset.row = row;
      cell.dataset.col = col;
      cell.addEventListener('click', () => {
        if (solving) return;
        if (currentMode === 'normal') {
          selectedCells = [[row, col]];
          renderBoard();
          return;
        }
        if (cage) {
          setStatus('This cell already belongs to a cage.', 'error');
          return;
        }
        toggleSelectedCell(row, col);
        renderBoard();
      });

      boardEl.appendChild(cell);
    }
  }
}

function toggleSelectedCell(row, col) {
  if (isSelectedCell(row, col)) {
    selectedCells = selectedCells.filter(([r, c]) => !(r === row && c === col));
  } else {
    selectedCells.push([row, col]);
  }
}

function renderCages() {
  cageListEl.innerHTML = '';
  cages.forEach((cage, index) => {
    const item = document.createElement('div');
    item.className = 'cage-item';
    const description = document.createElement('span');
    description.className = 'cage-description';
    description.textContent = `Cage ${index + 1}: ${cage.cells.map(([r, c]) => `(${r + 1},${c + 1})`).join(' ')} | Total: ${cage.total}`;
    const deleteButton = document.createElement('button');
    deleteButton.type = 'button';
    deleteButton.className = 'cage-delete';
    deleteButton.textContent = 'Delete';
    deleteButton.setAttribute('aria-label', `Delete cage ${index + 1}`);
    deleteButton.addEventListener('click', () => deleteCage(index));
    item.style.background = cageColors[cage.colorIndex % cageColors.length];
    item.append(description, deleteButton);
    cageListEl.appendChild(item);
  });
}

function deleteCage(index) {
  if (!cages[index]) return;
  cages.splice(index, 1);
  renderBoard();
  renderCages();
  setStatus(`Cage ${index + 1} deleted.`, 'success');
}

function saveCurrentCage() {
  if (!selectedCells.length) {
    setStatus('Select some cells first.', 'error');
    return;
  }

  const total = Number(cageTotalInput.value);
  if (!Number.isInteger(total) || total < 1 || total > 81) {
    setStatus('Enter a valid total (1-81).', 'error');
    return;
  }

  const overlapping = selectedCells.filter(([row, col]) => getCageForCell(row, col));
  if (overlapping.length) {
    setStatus('Some selected cells already belong to a cage.', 'error');
    return;
  }

  cages.push({
    cells: [...selectedCells],
    total,
    colorIndex: cages.length % cageColors.length
  });

  selectedCells = [];
  renderBoard();
  renderCages();
  setStatus(`Cage saved: ${total}`, 'success');
}

function cloneBoard(grid) {
  return grid.map((row) => [...row]);
}

function generateUniqueCombinations(size, total) {
  const results = [];
  const digits = [1, 2, 3, 4, 5, 6, 7, 8, 9];

  function backtrack(start, remaining, current) {
    if (current.length === size) {
      if (remaining === 0) results.push([...current]);
      return;
    }
    for (let i = start; i < digits.length; i++) {
      const value = digits[i];
      if (value > remaining) break;
      current.push(value);
      backtrack(i + 1, remaining - value, current);
      current.pop();
    }
  }

  backtrack(0, total, []);
  return results;
}

function permute(arr) {
  const results = [];

  function backtrack(current, remaining) {
    if (remaining.length === 0) {
      results.push([...current]);
      return;
    }
    for (let i = 0; i < remaining.length; i++) {
      const next = [...remaining];
      const value = next.splice(i, 1)[0];
      current.push(value);
      backtrack(current, next);
      current.pop();
    }
  }

  backtrack([], [...arr]);
  return results;
}

function isValidSudokuPlacement(grid, row, col, value) {
  for (let i = 0; i < 9; i++) {
    if (i !== col && grid[row][i] === value) return false;
    if (i !== row && grid[i][col] === value) return false;
  }

  const boxRow = Math.floor(row / 3) * 3;
  const boxCol = Math.floor(col / 3) * 3;
  for (let r = boxRow; r < boxRow + 3; r++) {
    for (let c = boxCol; c < boxCol + 3; c++) {
      if ((r !== row || c !== col) && grid[r][c] === value) return false;
    }
  }

  return true;
}

function enterNormalDigit(value) {
  if (!selectedCells.length) {
    setStatus('Select a cell first.', 'error');
    return;
  }

  const [row, col] = selectedCells[0];
  if (!isValidSudokuPlacement(board, row, col, value)) {
    setStatus('That digit conflicts with its row, column, or 3x3 box.', 'error');
    return;
  }

  board[row][col] = value;
  renderBoard();
  setStatus(`Entered ${value} at row ${row + 1}, column ${col + 1}.`, 'success');
}

function clearNormalDigit() {
  if (!selectedCells.length) {
    setStatus('Select a cell first.', 'error');
    return;
  }

  const [row, col] = selectedCells[0];
  board[row][col] = 0;
  renderBoard();
  setStatus('Cell cleared.', 'success');
}

function cageIsCompatible(grid, cage, row, col, value) {
  const next = cloneBoard(grid);
  next[row][col] = value;

  const cells = cage.cells;
  const values = cells.map(([r, c]) => next[r][c]);
  const filled = values.filter((v) => v !== 0);

  if (filled.length < cells.length) return true;

  const sum = filled.reduce((acc, v) => acc + v, 0);
  if (sum !== cage.total) return false;

  const combos = generateUniqueCombinations(cells.length, cage.total);
  for (const combo of combos) {
    const perms = permute(combo);
    for (const perm of perms) {
      let ok = true;
      for (let i = 0; i < cells.length; i++) {
        const [r, c] = cells[i];
        if (next[r][c] !== 0 && next[r][c] !== perm[i]) {
          ok = false;
          break;
        }
      }
      if (ok) return true;
    }
  }

  return false;
}

function findEmptyCell(grid) {
  let bestCell = null;
  for (let row = 0; row < 9; row++) {
    for (let col = 0; col < 9; col++) {
      if (grid[row][col] !== 0) continue;

      const candidates = [];
      const cage = getCageForCell(row, col);
      for (let value = 1; value <= 9; value++) {
        if (!isValidSudokuPlacement(grid, row, col, value)) continue;
        if (cage && !cageIsCompatible(grid, cage, row, col, value)) continue;
        candidates.push(value);
      }

      if (!bestCell || candidates.length < bestCell.candidates.length) {
        bestCell = { row, col, candidates };
      }
      if (candidates.length <= 1) return bestCell;
    }
  }
  return bestCell;
}

function solveKillerSudoku(grid) {
  const nextCell = findEmptyCell(grid);
  if (!nextCell) return true;
  if (nextCell.candidates.length === 0) return false;

  const { row, col, candidates } = nextCell;
  for (const value of candidates) {
    grid[row][col] = value;
    if (solveKillerSudoku(grid)) return true;
    grid[row][col] = 0;
  }

  return false;
}

function validateAllCellsAssigned() {
  let missing = 0;
  for (let row = 0; row < 9; row++) {
    for (let col = 0; col < 9; col++) {
      if (!getCageForCell(row, col)) missing++;
    }
  }

  if (missing > 0) {
    setStatus(`${missing} cells are not assigned to a cage.`, 'error');
    return false;
  }
  return true;
}

function workerSource() {
  const fns = [cloneBoard, generateUniqueCombinations, permute, isValidSudokuPlacement,
    cageIsCompatible, findEmptyCell, solveKillerSudoku, getCageForCell].map((f) => f.toString()).join('\n');
  return `let cages = [];\n${fns}\nonmessage = (e) => { cages = e.data.cages; const g = e.data.grid; postMessage(solveKillerSudoku(g) ? g : null); };`;
}

function runSolver(grid) {
  return new Promise((resolve) => {
    let worker = null;
    function fallback() {
      setTimeout(() => resolve(solveKillerSudoku(grid) ? grid : null), 120);
    }
    try {
      worker = new Worker(URL.createObjectURL(new Blob([workerSource()], { type: 'text/javascript' })));
    } catch (err) {
      worker = null;
    }
    if (!worker) return fallback();
    worker.onmessage = (e) => { worker.terminate(); resolve(e.data); };
    worker.onerror = () => { worker.terminate(); fallback(); };
    worker.postMessage({ grid, cages });
  });
}

let flickerId = null;
function startFlicker() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  flickerId = setInterval(() => {
    boardEl.querySelectorAll('.cell').forEach((cell) => {
      if (Math.random() > 0.35) return;
      let v = cell.querySelector('.value');
      if (!v) {
        v = document.createElement('span');
        v.className = 'value ghost';
        cell.appendChild(v);
      }
      v.textContent = 1 + Math.floor(Math.random() * 9);
      v.classList.remove('tick');
      void v.offsetWidth;
      v.classList.add('tick');
    });
  }, 110);
}

function setBusy(on) {
  clearInterval(flickerId);
  if (on) startFlicker();
  solving = on;
  boardEl.classList.toggle('solving', on);
  thinkingEl.hidden = !on;
  document.querySelectorAll('.app button').forEach((button) => { button.disabled = on; });
}

function celebrate() {
  const colors = ['#b8893b', '#e0bd76', '#16323a', '#8fb8a8', '#d9a3a8', '#9db4d6'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.style.left = Math.random() * 100 + '%';
    s.style.background = colors[i % colors.length];
    s.style.width = 5 + Math.random() * 4 + 'px';
    s.style.height = 9 + Math.random() * 7 + 'px';
    s.style.animationDelay = Math.random() * 0.6 + 's';
    s.style.animationDuration = 1.6 + Math.random() * 1.2 + 's';
    stageEl.appendChild(s);
    setTimeout(() => s.remove(), 3200);
  }
}

function solve() {
  if (solving) return;
  if (currentMode === 'killer') {
    if (cages.length === 0) {
      setStatus('Add at least one cage first.', 'error');
      return;
    }
    if (!validateAllCellsAssigned()) return;
  } else if (!board.some((row) => row.some((value) => value !== 0))) {
    setStatus('Enter at least one given number first.', 'error');
    return;
  }

  selectedCells = [];
  renderBoard();
  setBusy(true);
  setStatus('Solving…');
  const t0 = Date.now();
  timeEl.textContent = '0.0';
  timerId = setInterval(() => { timeEl.textContent = ((Date.now() - t0) / 1000).toFixed(1); }, 100);

  runSolver(cloneBoard(board)).then((result) => {
    clearInterval(timerId);
    setBusy(false);
    if (result) {
      board = result;
      renderBoard(true);
      celebrate();
      setStatus('Sudoku solved.', 'success');
    } else {
      renderBoard();
      setStatus('No solution found for this configuration.', 'error');
    }
  });
}

function resetAll() {
  selectedCells = [];
  cages = [];
  board = Array.from({ length: 9 }, () => Array(9).fill(0));
  renderBoard();
  renderCages();
  setStatus('Board reset.', 'success');
}

normalModeBtn.addEventListener('click', () => switchMode('normal'));
killerModeBtn.addEventListener('click', () => switchMode('killer'));
document.querySelectorAll('.digit-key').forEach((button) => {
  button.addEventListener('click', () => enterNormalDigit(Number(button.dataset.digit)));
});
document.getElementById('clearDigitBtn').addEventListener('click', clearNormalDigit);
document.addEventListener('keydown', (event) => {
  if (currentMode !== 'normal' || !selectedCells.length || event.target.closest('input, textarea, select')) return;
  if (/^[1-9]$/.test(event.key)) {
    event.preventDefault();
    enterNormalDigit(Number(event.key));
  } else if (event.key === 'Backspace' || event.key === 'Delete' || event.key === '0') {
    event.preventDefault();
    clearNormalDigit();
  }
});

cageTotalInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    event.preventDefault();
    saveCurrentCage();
  }
});

document.getElementById('saveCageBtn').addEventListener('click', saveCurrentCage);
document.getElementById('solveBtn').addEventListener('click', solve);
document.getElementById('resetBtn').addEventListener('click', resetAll);

renderBoard();
renderCages();
</script>
</body>
